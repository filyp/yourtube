name: Publish krakow-rust

on:
  push:
    tags:
      - 'krakow-rust-v*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        target: [x86_64, aarch64]
        exclude:
          - os: windows-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: publish
          target: ${{ matrix.target }}
          args: -m krakow_rust/Cargo.toml --interpreter 3.11 3.12 3.13 3.14 --skip-existing
          manylinux: auto
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
