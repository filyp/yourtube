[project]
name = "yourtube"
version = "1.0.0"
description = "Better youtube recommendations"
authors = [{name = "Filip Sondej", email = "filipsondej@protonmail.com"}]
license = {text = "LGPL-2.1"}
requires-python = ">=3.10,<3.12"
dependencies = [
    "networkx>=2.6.1,<3",
    "tqdm>=4.61.2,<5",
    "requests>=2.26.0,<3",
    "matplotlib>=3.4.2,<4",
    "numpy>=1.21.0,<2",
    "magic-wormhole>=0.12.0,<1",
    "python-dateutil>=2.8.2,<3",
    "scipy>=1.7.0,<2",
    "youtube-transcript-api>=0.4.1,<1",
    "pickledb>=0.9.2,<1",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.18,<1",
    "krakow>=0.2.0,<1",
    "pyyaml>=6.0.1,<7",
    "yt-dlp>=2026.2.4",
]

[project.scripts]
yourtube = "yourtube.__init__:main"
yourtube-fetch-playlists = "yourtube.fetch_playlists:main"
yourtube-scrape = "yourtube.scraping:scrape_recommendations"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
