<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>YourTube</title>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <link rel="stylesheet" href="/static/style.css?v=2">
</head>
<body>
    <aside>
        <h2>YourTube</h2>
        <label>Groups
            <input type="range" name="num_of_groups" value="{{ state.num_of_groups }}" min="2" max="10" step="1"
                   hx-post="/update-num-of-groups" hx-target="#video-wall" hx-swap="outerHTML"
                   hx-trigger="change" hx-include="this"
                   oninput="this.nextElementSibling.textContent = this.value">
            <span class="range-val">{{ state.num_of_groups }}</span>
        </label>
        <label>Videos/group
            <input type="range" name="videos_in_group" value="{{ state.videos_in_group }}" min="1" max="10" step="1"
                   hx-post="/update-videos-in-group" hx-target="#video-wall" hx-swap="outerHTML"
                   hx-trigger="change" hx-include="this"
                   oninput="this.nextElementSibling.textContent = this.value">
            <span class="range-val">{{ state.videos_in_group }}</span>
        </label>
        <label>Column width
            <input type="range" name="column_width" value="{{ state.column_width }}" min="100" max="500" step="10"
                   hx-post="/update-column-width" hx-target="#video-wall" hx-swap="outerHTML"
                   hx-trigger="change" hx-include="this"
                   oninput="this.nextElementSibling.textContent = this.value">
            <span class="range-val">{{ state.column_width }}</span>
        </label>
        {% if playlists %}
        <div class="sidebar-label">Rank by playlist</div>
        <select name="rank_playlist" class="sidebar-select"
                hx-post="/update-rank-playlist" hx-target="#video-wall" hx-swap="outerHTML"
                hx-trigger="change" hx-include="this">
            {% for name in playlists %}
            <option value="{{ name }}" {% if name == selected_playlist %}selected{% endif %}>{{ name }}</option>
            {% endfor %}
        </select>
        <div class="range-slider-label">
            <span>Playlist range</span>
            <span class="range-val" id="range-display">{{ "%.0f"|format(playlist_range[0]*100) }}-{{ "%.0f"|format(playlist_range[1]*100) }}%</span>
        </div>
        <div class="dual-range" hx-post="/update-playlist-range" hx-target="#video-wall" hx-swap="outerHTML"
             hx-trigger="change from:input" hx-include="#range-start, #range-end">
            <input type="range" id="range-start" name="range_start" 
                   min="0" max="1" step="0.01" value="{{ playlist_range[0] }}"
                   oninput="updateRangeDisplay()">
            <input type="range" id="range-end" name="range_end"
                   min="0" max="1" step="0.01" value="{{ playlist_range[1] }}"
                   oninput="updateRangeDisplay()">
        </div>
        <script>
        function updateRangeDisplay() {
            const start = document.getElementById('range-start');
            const end = document.getElementById('range-end');
            // Prevent crossing
            if (parseFloat(start.value) > parseFloat(end.value)) {
                start.value = end.value;
            }
            document.getElementById('range-display').textContent = 
                Math.round(start.value * 100) + '-' + Math.round(end.value * 100) + '%';
        }
        </script>
        {% endif %}
    </aside>

    <main>
        {% if dendrogram_src %}
        <img id="dendrogram" src="{{ dendrogram_src }}">
        {% endif %}

        <div id="toolbar">
            <button hx-post="/go-back" hx-target="#video-wall" hx-swap="outerHTML">Go back</button>

            <div class="sep"></div>

            <label style="font-size:13px;">Exploration</label>
            <input type="range" name="exploration" value="{{ state.exploration }}"
                   min="0" max="1" step="0.01"
                   hx-post="/update-exploration" hx-target="#video-wall" hx-swap="outerHTML"
                   hx-trigger="change" hx-include="this">

            <input type="text" name="cluster_name" placeholder="Cluster name">
            <button hx-post="/save-cluster" hx-target="#video-wall" hx-swap="outerHTML"
                    hx-include="[name='cluster_name']">Save</button>

            <div class="sep"></div>

            <select name="saved_cluster">
                {% for name in saved_clusters %}
                <option value="{{ name }}">{{ name }}</option>
                {% endfor %}
            </select>
            <button hx-post="/load-cluster" hx-target="#video-wall" hx-swap="outerHTML"
                    hx-include="[name='saved_cluster']">Load</button>
        </div>

        <div id="message">{{ message }}</div>

        {% include "partials/video_wall.html" %}
    </main>
</body>
</html>
